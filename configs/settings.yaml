# ChatSQL 配置
model:
  # 任意 OpenAI 兼容端点：DeepSeek / Qwen / OpenAI / Ollama
  name: ${MODEL_NAME:-deepseek-flash}
  base_url: ${OPENAI_BASE_URL:-https://api.deepseek.com}
  api_key: ${OPENAI_API_KEY:-}
  temperature: 0.0
  max_tokens: 2048
  timeout: 60

database:
  # BIRD mini_dev 数据库根目录，每个子目录是一个库；可用 CHATSQL_DB_ROOT 指向自己的库目录
  root: ${CHATSQL_DB_ROOT:-data/mini_dev_data/dev_databases}

execution:
  timeout_seconds: 30
  max_rows: 100

mock:
  # CHATSQL_MOCK=1 或 api_key 为空时使用 mock 客户端（离线开发/测试用）
  enabled: ${CHATSQL_MOCK:-0}

rag:
  enabled: ${CHATSQL_RAG:-1}     # 0/false 关闭检索（消融用，等同 --no-rag）
  top_k_examples: 3              # few-shot 相似问答对数量
  top_k_knowledge: 3             # 业务知识/列描述条数
  embedding_model: all-MiniLM-L6-v2
  index_dir: data/index

agent:
  max_correction_rounds: 3    # SQL 生成-执行 的最大纠错轮次
  linking_table_threshold: 20 # 表数超过该值才启用 schema linking 裁剪
  retry_on_empty: true        # 结果为空时给一次"检查过滤条件"的修正机会
  trace_dir: runs             # trace 日志目录（JSONL）
