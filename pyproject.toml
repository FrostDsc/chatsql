[project]
name = "chatsql"
version = "0.1.0"
description = "Agentic Text-to-SQL：自然语言查询 SQLite 数据库（BIRD mini_dev）"
readme = "README.md"
authors = [
    { name = "lingdongyue", email = "2447565917@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.13.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlglot>=30.18.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
